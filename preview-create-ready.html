<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Preview - GetForm</title>
  <link rel="icon" type="image/svg+xml" href="Glogo.png" />
  <style>
    :root {
      --teal:#0f766e; --teal-dark:#0b5d56; --page:#f5f7f6;
      --surface:#fff; --text:#202124; --muted:#6b7280; --line:#dfe3e7;
      --soft:#e8f5f2;
    }
    body.dark {
      --page:#182522; --surface:#243532; --text:#f4f0e8;
      --muted:#b6c1bd; --line:#40524e; --soft:#294943;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--page); color:var(--text);
      font:15px/1.45 Arial,sans-serif;
    }
    .topbar {
      align-items:center; background:var(--teal-dark); color:#fff;
      display:flex; justify-content:space-between;
      padding:16px clamp(20px,6vw,88px);
      box-shadow:0 2px 10px rgba(0,0,0,.12);
      position:sticky; top:0; z-index:10;
    }
    .brand {
      color:#fff; font-size:1.35rem; font-weight:700;
      text-decoration:none;
    }
    .top-actions { display:flex; align-items:center; gap:12px; }
.theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: transparent;
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 999px;
  color: #fff;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 14px;
  transition: all .2s ease;
}

.brand {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #ffffff;
}

.brand span {
    color: #a8eee3;
}

.theme-toggle:hover {
  background: rgba(255,255,255,.12);
  border-color: #fff;
  transform: translateY(-1px);
}

.theme-toggle:active {
  transform: translateY(0);
}
    main { max-width:900px; margin:0 auto; padding:40px 20px 70px; }
    .preview-banner {
      background:var(--soft); border:1px solid var(--teal);
      border-radius:10px; color:var(--teal-dark);
      margin-bottom:18px; padding:12px 16px; font-weight:600;
    }
    body.dark .preview-banner { color:#a9e0d8; }
    .card {
      background:var(--surface); border:1px solid var(--line);
      border-radius:12px; box-shadow:0 3px 12px rgba(32,33,36,.07);
      margin:16px 0; padding:30px;
    }
    .hero { border-top:6px solid var(--teal); }
    h1 { margin:0 0 10px; font-size:clamp(2rem,5vw,3rem); }
    .description { color:var(--muted); white-space:pre-wrap; }
    .question-title { font-weight:700; margin-bottom:14px; }
    .required { color:#c0392b; margin-left:4px; }
    .field {
      background:var(--surface); border:1px solid var(--line);
      border-radius:7px; color:var(--text); font:inherit;
      padding:13px 14px; width:100%;
    }
    textarea.field { min-height:100px; resize:vertical; }
    .option { display:flex; gap:10px; align-items:center; margin:12px 0; }
    .option label { flex:1; }
    .rating { font-size:1.5rem; letter-spacing:4px; }
    .file-note { color:var(--muted); font-size:.9rem; }
    .empty {
      color:var(--muted); text-align:center; padding:30px;
    }
    .back {
      background:var(--teal); border:0; border-radius:7px; color:#fff;
      cursor:pointer; font-weight:700; padding:12px 18px;
      margin-top:6px;
    }
    @media(max-width:580px) {
      main { padding:24px 14px 50px; }
      .card { padding:22px; }
      .top-actions { gap:6px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="forms.html">
      <img src="Glogo.png" width="50" height="50" alt="GetForm logo">
      Get<span>Form</span>
    </a>
    <div class="top-actions">
      <button class="theme-toggle" id="themeToggle" type="button">🌙 Dark mode</button>
    </div>
  </header>

  <main>
    <div class="preview-banner">👁 Preview mode — this form has not been created yet. Submitting is disabled.</div>
    <div id="preview"></div>
  </main>

  <script>
    const preview = document.getElementById('preview');
    const themeToggle = document.getElementById('themeToggle');

    function setTheme(theme) {
      const dark = theme === 'dark';
      document.body.classList.toggle('dark', dark);
      themeToggle.textContent = dark ? 'Light mode' : 'Dark mode';
      localStorage.setItem('getform-theme', dark ? 'dark' : 'light');
    }

    setTheme(localStorage.getItem('getform-theme') || 'light');
    themeToggle.addEventListener('click', () => {
      setTheme(document.body.classList.contains('dark') ? 'light' : 'dark');
    });

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
      }[char]));
    }

    function renderQuestion(q, index) {
      const title = escapeHtml(q.question || `Question ${index + 1}`);
      const required = q.required ? '<span class="required">*</span>' : '';
      const type = q.type;
      const options = Array.isArray(q.configuration?.options)
        ? q.configuration.options.filter(Boolean)
        : [];

      let input = '';

      if (type === 'LONG_TEXT') {
        input = '<textarea class="field" disabled placeholder="Your answer"></textarea>';
      } else if (type === 'NUMBER') {
        input = '<input class="field" type="number" disabled placeholder="Your answer">';
      } else if (type === 'EMAIL') {
        input = '<input class="field" type="email" disabled placeholder="Your email">';
      } else if (type === 'DATE') {
        input = '<input class="field" type="date" disabled>';
      } else if (type === 'FILE_UPLOAD') {
        input = '<input class="field" type="file" disabled><div class="file-note">File upload is disabled in preview.</div>';
      } else if (type === 'RATING') {
        input = '<div class="rating" aria-label="Rating">☆ ☆ ☆ ☆ ☆</div>';
      } else if (type === 'SINGLE_CHOICE') {
        input = options.length
          ? options.map(o => `<div class="option"><input type="radio" disabled><label>${escapeHtml(o)}</label></div>`).join('')
          : '<div class="file-note">No options added.</div>';
      } else if (type === 'MULTIPLE_CHOICE' || type === 'CHECKBOX') {
        input = options.length
          ? options.map(o => `<div class="option"><input type="checkbox" disabled><label>${escapeHtml(o)}</label></div>`).join('')
          : '<div class="file-note">No options added.</div>';
      } else if (type === 'DROPDOWN') {
        input = `<select class="field" disabled>
          <option>Select an option</option>
          ${options.map(o => `<option>${escapeHtml(o)}</option>`).join('')}
        </select>`;
      } else {
        input = '<input class="field" type="text" disabled placeholder="Your answer">';
      }

      return `<section class="card">
        <div class="question-title">${index + 1}. ${title}${required}</div>
        ${input}
      </section>`;
    }

    function loadPreview() {
      const raw = sessionStorage.getItem('getform-preview-draft');

      if (!raw) {
        preview.innerHTML = `
          <section class="card empty">
            <p>No temporary form data was found.</p>
            <button class="back" onclick="window.location.href='index.html'">← Back to Create Form</button>
          </section>`;
        return;
      }

      try {
        const data = JSON.parse(raw);
        const questions = Array.isArray(data.questions) ? data.questions : [];

        preview.innerHTML = `
          <section class="card hero">
            <h1>${escapeHtml(data.title || 'Untitled form')}</h1>
            ${data.description ? `<div class="description">${escapeHtml(data.description)}</div>` : ''}
          </section>
          ${questions.length
            ? questions.map(renderQuestion).join('')
            : '<section class="card empty">No questions added yet.</section>'}
          <button class="back" onclick="window.close();">← Back</button>
        `;
      } catch (error) {
        preview.innerHTML = `
          <section class="card empty">
            <p>Could not read the temporary form data.</p>
            <button class="back" onclick="window.location.href='index.html'">← Back to Create Form</button>
          </section>`;
      }
    }

    loadPreview();
  </script>
</body>
</html>
